name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm run test:run

      - name: Build
        run: npm run build

      # A green build that produced nothing would still pass otherwise
      - name: Check the bundles exist
        run: |
          test -s dist/index.global.js
          test -s dist/index.js
          test -s dist/index.mjs
          test -s dist/index.d.ts
